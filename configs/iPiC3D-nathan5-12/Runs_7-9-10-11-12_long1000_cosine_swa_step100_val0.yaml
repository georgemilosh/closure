# ---------------------------------------------------------------
# Long-run config (1000 epochs): cosine decay + SWA
# Dataset: iPiC3D nathan5-12 (train Runs_7-9-10-11-12, val RunID_1, test RunID_5)
# ---------------------------------------------------------------

seed_everything: 42

model:
  network:
    class_path: closure.models.FCNN
    init_args:
      channels: [10, 128, 128, 64, 6]
      kernels:  [3, 3, 5, 3]
      activations: [SiLU, SiLU, SiLU, null]
      batch_norms: [true, true, true, false]
      dropouts:    [0.0, 0.15, 0.15, 0.0]
  criterion: MSELoss
  optimizer: AdamW
  lr: 4.0e-4
  weight_decay: 3.0e-4
  scheduler: CosineAnnealingLR
  scheduler_kwargs:
    T_max: 1000
    eta_min: 1.0e-6
    interval: epoch

data:
  data_folder: iPiC3D-nathan
  train_samples_file: ./splits/iPiC3D-nathan5-12/Runs_7-9-10-11-12_step100.csv
  val_samples_file: ./splits/iPiC3D-nathan5-12/RunID_0.csv
  test_samples_file: ./splits/iPiC3D-nathan5-12/RunID_5_step100.csv
  batch_size: 32
  num_workers: 12
  flatten: false
  scaler_features: true
  scaler_targets: true
  prescaler_targets: [log, log, log, arcsinh, arcsinh, arcsinh]
  features_dtype: float32
  targets_dtype: float32
  features_dtype_numpy: float32
  targets_dtype_numpy: float32
  patch_dim: [64, 64]
  subsample_rate: 200
  subsample_seed: 42
  alfven_units: true
  read_features_targets_kwargs:
    fields_to_read:
      B: true
      B_ext: false
      divB: false
      E: true
      E_ext: false
      rho: true
      J: true
      P: true
      PI: true
      Heat_flux: false
      N: false
      Qrem: false
    request_features:
      - rho_e
      - Bx
      - By
      - Bz
      - Vx_e
      - Vy_e
      - Vz_e
      - Ex
      - Ey
      - Ez
    request_targets:
      - Pxx_e
      - Pyy_e
      - Pzz_e
      - Pxy_e
      - Pxz_e
      - Pyz_e
    choose_species: ['e', null, 'e', null]
    verbose: false

trainer:
  gradient_clip_val: 1.0
  gradient_clip_algorithm: norm
  max_epochs: 1000
  accelerator: auto
  devices: auto
  strategy: auto
  default_root_dir: ./models/Lightning/iPiC3D-nathan5-12/Runs_7-9-10-11-12_long1000_cosine_swa_val0
  callbacks:
    - class_path: lightning.pytorch.callbacks.EarlyStopping
      init_args:
        monitor: val_loss
        patience: 100
        mode: min
        min_delta: 5.0e-4
    - class_path: lightning.pytorch.callbacks.ModelCheckpoint
      init_args:
        monitor: val_loss
        save_top_k: 1
        save_last: true
        mode: min
        filename: best-{epoch}-{val_loss:.4f}
    - class_path: lightning.pytorch.callbacks.ModelCheckpoint
      init_args:
        every_n_epochs: 100
        save_top_k: -1
        save_last: false
        filename: epoch-{epoch:04d}
        auto_insert_metric_name: false
    - class_path: lightning.pytorch.callbacks.LearningRateMonitor
      init_args:
        logging_interval: epoch
    - class_path: lightning.pytorch.callbacks.StochasticWeightAveraging
      init_args:
        swa_lrs: 5.0e-5
        swa_epoch_start: 0.90
        annealing_epochs: 20
        annealing_strategy: cos
  logger:
    class_path: lightning.pytorch.loggers.CSVLogger
